[package]
name = "forgekit"
version = "1.4.7"
description = "ForgeKit — набор из 40+ профессиональных инструментов в одном приложении"
authors = ["Pavel Labushev"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "forgekit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "image-png", "tray-icon"] }
window-vibrancy = "0.6"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
lopdf = "0.34"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
sysinfo = "0.33"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
qrcode = "0.14"
ureq = "2"
anyhow = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4", "v7"] }
rand = "0.8"
aes-gcm = "0.10"
pbkdf2 = "0.12"
percent-encoding = "2"
